<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>ProxToBoltFu — flat vector logo (rack + bolt + gears)</title>
  <defs>
    <!-- Palette -->
    <style>
      .bg{fill:transparent}
      .rack{fill:#2B2F33}
      .rackFace{fill:#3B4147}
      .bolt{fill:#FFC400}
      .boltShadow{fill:#E6AE00}
      .outline{fill:#111111}
      .gear{fill:#C5D3E5}
      .gearDark{fill:#9AA9BD}
      .orbit{fill:none;stroke:#B5C4D8;stroke-width:24;stroke-linecap:round}
      .rackStroke{fill:none;stroke:#111111;stroke-width:20}
      .cut{fill:#ffffff}
    </style>
    <!-- Simple drop shadow via blur-less offset for crisp, flat look -->
    <filter id="flatShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="8" result="off"/>
      <feComposite in="SourceGraphic" in2="off" operator="over"/>
    </filter>

    <!-- Gear: built from core circle + 8 teeth -->
    <g id="gear8">
      <circle cx="0" cy="0" r="74" class="gear"/>
      <circle cx="0" cy="0" r="38" class="gearDark"/>
      <!-- teeth -->
      <g fill="#C5D3E5">
        <rect x="-12" y="-116" width="24" height="30" rx="3"/>
        <rect x="-12" y="86"  width="24" height="30" rx="3"/>
        <rect x="-116" y="-12" width="30" height="24" rx="3"/>
        <rect x="86"   y="-12" width="30" height="24" rx="3"/>
        <g transform="rotate(45)">
          <rect x="-12" y="-116" width="24" height="30" rx="3"/>
          <rect x="-12" y="86"  width="24" height="30" rx="3"/>
          <rect x="-116" y="-12" width="30" height="24" rx="3"/>
          <rect x="86"   y="-12" width="30" height="24" rx="3"/>
        </g>
      </g>
      <!-- inner hole -->
      <circle cx="0" cy="0" r="18" fill="#2B2F33"/>
    </g>

    <!-- Lightning bolt (two layers for flat shadow) -->
    <g id="boltShape">
      <path class="boltShadow" d="M620 98 L458 394 L617 394 L420 744 L466 524 L325 524 L463 258 Z"/>
      <path class="bolt" d="M600 78 L438 374 L598 374 L401 724 L447 504 L306 504 L444 238 Z"/>
    </g>

    <!-- Rack faceplate with three units -->
    <g id="rackBlock">
      <rect x="0" y="0" width="560" height="620" rx="40" class="rack"/>
      <!-- bays -->
      <g transform="translate(40,70)">
        <rect width="480" height="140" rx="22" class="rackFace"/>
        <circle cx="40" cy="70" r="12" fill="#262A2E"/>
        <circle cx="80" cy="70" r="12" fill="#262A2E"/>
        <rect x="130" y="58" width="260" height="24" rx="12" fill="#262A2E"/>
      </g>
      <g transform="translate(40,240)">
        <rect width="480" height="140" rx="22" class="rackFace"/>
        <circle cx="40" cy="70" r="12" fill="#262A2E"/>
        <circle cx="80" cy="70" r="12" fill="#262A2E"/>
        <rect x="130" y="58" width="260" height="24" rx="12" fill="#262A2E"/>
      </g>
      <g transform="translate(40,410)">
        <rect width="480" height="140" rx="22" class="rackFace"/>
        <circle cx="40" cy="70" r="12" fill="#262A2E"/>
        <circle cx="80" cy="70" r="12" fill="#262A2E"/>
        <rect x="130" y="58" width="260" height="24" rx="12" fill="#262A2E"/>
      </g>
      <!-- subtle outline -->
      <rect x="10" y="10" width="540" height="600" rx="36" class="rackStroke"/>
    </g>

    <!-- Mask so the bolt appears to slice through/over elements -->
    <mask id="sliceMask">
      <rect width="1024" height="1024" fill="black"/>
      <!-- show everything -->
      <use href="#rackBlock" x="232" y="202" fill="white"/>
      <use href="#boltShape" x="-10" y="0" transform="translate(80,60) scale(1.06)" />
      <use href="#gear8" x="0" y="0" transform="translate(770,300) scale(1.0)" fill="white"/>
      <use href="#gear8" x="0" y="0" transform="translate(340,760) scale(0.9)" fill="white"/>
      <ellipse cx="560" cy="520" rx="360" ry="240" fill="white"/>
    </mask>
  </defs>

  <rect class="bg" width="1024" height="1024"/>

  <!-- Orbit ring (behind bolt, around rack) -->
  <g mask="url(#sliceMask)">
    <ellipse cx="560" cy="520" rx="360" ry="240" class="orbit"/>
  </g>

  <!-- Rack -->
  <g filter="url(#flatShadow)">
    <use href="#rackBlock" x="232" y="202"/>
  </g>

  <!-- Gears -->
  <g filter="url(#flatShadow)">
    <use href="#gear8" x="770" y="300"/>
    <use href="#gear8" x="340" y="760" transform="rotate(18 340 760) scale(0.92)"/>
  </g>

  <!-- Bolt on top -->
  <g filter="url(#flatShadow)">
    <use href="#boltShape" x="80" y="60"/>
  </g>
</svg>
