---
version: 2
config:
  transport: ssh
  ssh:
    private-key: ~/.ssh/id_ed25519
    user: tgreen  # Update this to your SSH username
    run-as: root
    host-key-check: false
    tmpdir: /var/tmp
groups:
  - name: puppet-infrastructure
    targets:
      _plugin: task
      task: proxtoboltfu::tofu_inventory
      parameters:
        dir: tf
        tag_filter: puppetinfra
  - name: puppet-enterprise-nodes
    targets:
      _plugin: task
      task: proxtoboltfu::tofu_inventory
      parameters:
        dir: tf
        tag_filter: puppet
  - name: scm-nodes
    targets:
      _plugin: task
      task: proxtoboltfu::tofu_inventory
      parameters:
        dir: tf
        tag_filter: scm
  - name: cd4pe-nodes
    targets:
      _plugin: task
      task: proxtoboltfu::tofu_inventory
      parameters:
        dir: tf
        tag_filter: cd4pe
  - name: puppet-agents
    targets:
      _plugin: task
      task: proxtoboltfu::tofu_inventory
      parameters:
        dir: tf
        tag_filter: puppetagents
